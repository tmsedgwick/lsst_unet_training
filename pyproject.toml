[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lsst_unet_training"
version = "0.1.0"
description = "Train, calibrate and evaluate a noise- and PSF-aware U-Net galaxy detector on mock LSST coadds"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Sedgwick", email = "t.m.sedgwick@outlook.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyarrow>=14", "scikit-learn>=1.3", "matplotlib>=3.7",
                "tensorflow>=2.16", "keras>=3.0"]

[tool.setuptools.packages.find]
include = ["lsst_unet_training*"]

[tool.ruff]
line-length = 120
